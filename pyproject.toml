[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "projecthub"
version = "0.1.0"
readme = "README.md"
description = "项目文件、审核、授权与设备远控服务"
requires-python = ">=3.14.7,<3.15"
dependencies = [
    "fastapi==0.162.5",
    "pydantic==2.14.3",
    "rfc8785==0.1.4",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
remote = ["cryptography==50.0.2"]
dev = ["httpx==0.28.1", "pytest==9.2.0", "ruff==0.17.4"]

[tool.setuptools]
py-modules = ["main", "service"]

[tool.setuptools.packages.find]
include = ["projecthub*", "scripts*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 110
extend-exclude = [".test_artifacts", "data", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"

